# 嘉壹启航运营工具平台 — 本机 / 服务器同一套一键启动
#
# 本机：
#   1. 安装 Docker Desktop
#   2. 项目根目录准备 .env（可参考 .env.example）
#   3. docker compose up --build
#   4. 浏览器打开 http://127.0.0.1:8080
#
# 服务器：
#   git clone 后同样放 .env，再执行 docker compose up -d --build
#   访问 http://服务器IP:8080 （可再绑域名 / HTTPS）

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: one-class-backend
    env_file:
      - .env
    environment:
      # 与 .env 的 APP_ENV / APP_DATA_DIR 对齐：dev=测试数据，prod=生产数据
      APP_ENV: ${APP_ENV:-production}
      # 容器内绝对路径；宿主机 ./data/{dev|prod} 通过卷挂载
      DATABASE_URL: sqlite:////app/data/${APP_DATA_DIR:-prod}/app.db
      STORAGE_ROOT: /app/data/${APP_DATA_DIR:-prod}/uploads
    volumes:
      - ./data:/app/data
    ports:
      # Optional direct API access (docs at :8000/docs). Frontend uses :8080 only.
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: one-class-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 可选：独立部署 GPT Image Playground（与 TokenShop「Gpt生图」同源项目）
  # 日常已内嵌在前端 /gpt-image-playground + 后端 /api/v1/image-playground 代理，一般不必再启。
  # 需要单独调试官方镜像时：
  #   docker compose --profile playground up -d gpt-image-playground
  gpt-image-playground:
    profiles: ["playground"]
    image: ghcr.io/cooksleep/gpt_image_playground:latest
    container_name: one-class-gpt-image-playground
    environment:
      # 仅作独立试验；正式业务请用站内「GPT 生图」页（经后端代理，不暴露 Key）
      DEFAULT_API_URL: ${IMAGE_API_BASE_URL:-https://api.openai.com}/v1
      ENABLE_API_PROXY: "false"
    ports:
      - "8090:80"
    restart: unless-stopped
