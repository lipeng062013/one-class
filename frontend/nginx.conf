server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large enough for teacher photo uploads
    client_max_body_size 50m;

    # SPA: all non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API to the backend service (compose network name: backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM / image generation can be slow
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # GPT Image Playground OpenAI-compatible proxy (same-origin, outside /api/v1)
    location /image-api/ {
        proxy_pass http://backend:8000/image-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}
