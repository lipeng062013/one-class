# Push master → SSH 到阿里云 → 同步代码 → 备份(OSS) → docker compose up
# 所需 Secrets 见 docs/ops-auto-deploy.md
name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Skip OSS backup before deploy (0/1)"
        required: false
        default: "0"

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # appleboy 通过 envs 把这些注入远端 shell
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SKIP_BACKUP: ${{ github.event.inputs.skip_backup || '0' }}
          BACKUP_REQUIRED: ${{ vars.BACKUP_REQUIRED || '0' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          envs: DEPLOY_PATH,SKIP_BACKUP,BACKUP_REQUIRED
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${DEPLOY_PATH:-/opt/one-class}"
            export SKIP_BACKUP="${SKIP_BACKUP:-0}"
            export BACKUP_REQUIRED="${BACKUP_REQUIRED:-0}"
            export DEPLOY_BRANCH=master

            echo "Linux user=$(id -un) DEPLOY_PATH=$DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: $DEPLOY_PATH 不是 git 仓库。请先手动 clone 一次。"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # 先同步到 origin/master，确保 scripts/ 存在（首次启用本 workflow 时必需）
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            chmod +x scripts/deploy/remote-deploy.sh \
              scripts/backup/backup-to-oss.sh \
              scripts/backup/restore-from-oss.sh \
              scripts/setup/install-ossutil.sh 2>/dev/null || true

            bash scripts/deploy/remote-deploy.sh
