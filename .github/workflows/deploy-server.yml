# Push master → 先 TypeScript 检查 → 通过后再 SSH 部署
# 避免 vue-tsc 错误拖到服务器 docker build 才失败
# 所需 Secrets 见 docs/ops-auto-deploy.md
name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Skip OSS backup before deploy (0/1)"
        required: false
        default: "0"
      skip_typecheck:
        description: "Skip frontend TypeScript check (0/1, emergency only)"
        required: false
        default: "0"

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  # 在 GitHub 上先跑 vue-tsc：失败则根本不触发远端部署，日志也更清晰
  typecheck:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_typecheck != '1' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_typecheck != '1' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_typecheck != '1' }}
        working-directory: frontend
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Run vue-tsc typecheck
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_typecheck != '1' }}
        working-directory: frontend
        run: npm run typecheck

      - name: Skip typecheck (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_typecheck == '1' }}
        run: |
          echo "WARN: skipped frontend typecheck (emergency deploy)"

  deploy:
    name: Deploy over SSH
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # appleboy 通过 envs 把这些注入远端 shell
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SKIP_BACKUP: ${{ github.event.inputs.skip_backup || '0' }}
          BACKUP_REQUIRED: ${{ vars.BACKUP_REQUIRED || '0' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          envs: DEPLOY_PATH,SKIP_BACKUP,BACKUP_REQUIRED
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${DEPLOY_PATH:-/opt/one-class}"
            export SKIP_BACKUP="${SKIP_BACKUP:-0}"
            export BACKUP_REQUIRED="${BACKUP_REQUIRED:-0}"
            export DEPLOY_BRANCH=master

            echo "Linux user=$(id -un) DEPLOY_PATH=$DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: $DEPLOY_PATH 不是 git 仓库。请先手动 clone 一次。"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # 先同步到 origin/master，确保 scripts/ 存在（首次启用本 workflow 时必需）
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            chmod +x scripts/deploy/remote-deploy.sh \
              scripts/backup/backup-to-oss.sh \
              scripts/backup/restore-from-oss.sh \
              scripts/setup/install-ossutil.sh 2>/dev/null || true

            bash scripts/deploy/remote-deploy.sh
